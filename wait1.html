<!DOCTYPE html>
<html>
<head>
<title>Wait Page</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<div class="card">

<img src="https://via.placeholder.com/300x100">

<h1>Please Wait</h1>

<h2 id="timer">15</h2>

<button id="continueBtn" disabled>Continue</button>

<img src="https://via.placeholder.com/300x100">

</div>
</div>

<script>
let time = 15;
let timer = document.getElementById('timer');
let btn = document.getElementById('continueBtn');

let x = setInterval(()=>{
 time--;
 timer.innerText = time;

 if(time<=0){
   clearInterval(x);
   btn.disabled = false;
 }
},1000)
</script>
</body>
</html>
